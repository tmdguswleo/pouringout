<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>푸어링아웃 독립 복구 · recovery-text-1</title>
<style>
body{margin:16px;background:white;color:black;font:15px/1.5 sans-serif;font-weight:400}
h1,h2{font-size:17px;font-weight:400}
pre{font:13px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<h1>푸어링아웃 독립 복구 기록</h1>
<p>복구 페이지 실행 버전: recovery-text-1 (2026-11-10)</p>
<p>앱 코드·공통 화면·공통 이벤트를 불러오지 않습니다. 기록은 읽기만 하며 생성·수정·삭제하지 않습니다.</p>
<p>아래 글은 화면 캡처 또는 길게 눌러 선택·복사할 수 있습니다. 다운로드 버튼은 없습니다.</p>
<p id="status">읽기 상태: 스크립트 실행 전. 이 문구가 그대로라면 JavaScript가 실행되지 않았거나 아직 완료되지 않은 상태입니다.</p>
<noscript><p>읽기 오류: JavaScript가 꺼져 있어 기기에 저장된 기록을 읽을 수 없습니다.</p></noscript>
<pre id="environment"></pre>
<div id="records"></div>
<script>
(function(){
  'use strict';
  var prefix='pn.noteDebug.v2.run.';
  var status=document.getElementById('status');
  var records=document.getElementById('records');
  var errors=0,count=0;
  function text(tag,value){var node=document.createElement(tag);node.textContent=value;records.appendChild(node)}
  function error(where,err){errors++;text('pre','읽기 오류 ['+where+']: '+String(err&&err.name||'Error')+' — '+String(err&&err.message||err))}
  try{
    document.getElementById('environment').textContent='현재 출처: '+location.origin+'\n현재 경로: '+location.pathname+'\n읽는 위치: 이 출처의 localStorage / '+prefix+'*\n조회 시각: '+new Date().toISOString();
    // 접근 오류를 기록 없음과 구분. 저장소·앱 데이터·활성화 플래그에는 쓰지 않음.
    var storage=window.localStorage;
    var keys=[];
    var length=storage.length;
    for(var i=0;i<length;i++){
      try{var key=storage.key(i);if(key&&key.indexOf(prefix)===0)keys.push(key)}catch(err){error('키 목록 '+i,err)}
    }
    keys.sort().reverse();
    text('p','발견한 진단 기록: '+keys.length+'개');
    for(var j=0;j<keys.length;j++){
      var k=keys[j],raw;
      text('h2','기록 '+(j+1)+' / '+keys.length);
      text('pre','저장 키: '+k);
      try{raw=storage.getItem(k)}catch(err){error(k,err);continue}
      if(raw===null){error(k,'조회 중 기록을 읽을 수 없게 되었습니다.');continue}
      count++;
      try{
        var data=JSON.parse(raw);
        text('pre','기록된 앱 실행 버전: '+String(data&&data.build||'없음')+'\n저장 형식: '+String(data&&data.schema||'없음'));
      }catch(err){error(k+' JSON 해석',err)}
      // 손상되거나 알 수 없는 형식도 원문 그대로 표시. HTML로 해석하지 않음.
      text('p','저장된 원문:');
      text('pre',raw);
    }
    if(!keys.length)text('p','이 출처에서 진단 기록을 찾지 못했습니다. 기록을 만든 동일한 앱·브라우저·프로필에서 여세요. 홈 화면 앱과 Safari는 저장 공간이 다를 수 있습니다.');
  }catch(err){error('localStorage 접근 또는 화면 표시',err)}
  status.textContent='읽기 완료: 원문 '+count+'개 표시 / 읽기 오류 '+errors+'건. 기존 저장 내용은 변경하지 않았습니다.';
})();
</script>
</body>
</html>
