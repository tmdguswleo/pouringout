<title>푸어링아웃 매장노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<style>
/* Layout: phone-first single column; sticky tab bar; each tab is a stack of plain sections */
:root{
  --bg:#f3f2f0; --surface:#ffffff; --ink:#1f1b18; --muted:#776f68; --line:#e3ded9;
  --accent:#5b3a29; --accent-ink:#ffffff; --soft:#efe7e1; --warn:#c2410c; --red:#d32f2f; --warn-bg:#fff1e8; --ok:#2f7a3d;
  --c-boss:var(--ink); --c-seunghyun:#178b8b; --c-wonseok:#e0742a; --c-woojun:#b08a00; --c-junhyung:#2f9a46; --c-daseul:#a160bf; --c-jeonghan:#2f62d6; --c-hojeong:#c2417a; --c-koha:#7a6a52;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161412; --surface:#211e1b; --ink:#f1ece7; --muted:#a39a92; --line:#37312c;
  --accent:#d9a77f; --accent-ink:#1b1410; --soft:#2c2520; --warn:#fb923c; --red:#ff6b6b; --warn-bg:#3a2214; --ok:#6fcf86;
  --c-seunghyun:#3cc0c0; --c-wonseok:#f59a55; --c-woojun:#e0bb3a; --c-junhyung:#5cc472; --c-daseul:#c993e0; --c-jeonghan:#6f97f0; --c-hojeong:#ee7fb0; --c-koha:#bfa98a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161412; --surface:#211e1b; --ink:#f1ece7; --muted:#a39a92; --line:#37312c;
  --accent:#d9a77f; --accent-ink:#1b1410; --soft:#2c2520; --warn:#fb923c; --red:#ff6b6b; --warn-bg:#3a2214; --ok:#6fcf86;
  --c-seunghyun:#3cc0c0; --c-wonseok:#f59a55; --c-woojun:#e0bb3a; --c-junhyung:#5cc472; --c-daseul:#c993e0; --c-jeonghan:#6f97f0; --c-hojeong:#ee7fb0; --c-koha:#bfa98a;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3,strong,b,th{font-weight:400}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:760px;margin:0 auto}
header.top{padding-block:16px 6px}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:400;letter-spacing:-.01em}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.status{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
.status.err{color:var(--warn)}
nav.tabs{z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .inner{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:2px 8px}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:400;font-size:14px;padding:6px 12px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs .tabedit{flex:0 0 auto;margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;display:inline-grid;place-items:center}
.fold-row.tabrow{grid-template-columns:minmax(0,1fr) auto}
main{padding-block:16px 64px}
main .inner{display:flex;flex-direction:column;gap:22px}
h2{font-size:15px;margin:0 0 8px;font-weight:400;display:flex;align-items:center;gap:8px;justify-content:space-between}
h2 .meta{font-size:12px;font-weight:400;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.list .by{font-size:12px;color:var(--muted)}
.chk{appearance:none;flex:0 0 auto;width:22px;height:22px;margin:0;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.x{flex:0 0 auto;font:inherit;font-size:16px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px}
.x:hover{color:var(--warn)}
.empty{padding:12px;color:var(--muted);font-size:13px}
.add{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
.add input,.add select{font:inherit;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink)}
.add input{flex:1}
.btn{font:inherit;font-weight:400;font-size:14px;border:0;border-radius:8px;padding:7px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:11px;font-weight:400;border-radius:6px;padding:0 6px;margin-right:6px;background:var(--soft);color:var(--muted);vertical-align:1px}
.pill.pouring{background:var(--accent);color:var(--accent-ink)}
.pill.meraki{background:var(--accent);color:var(--accent-ink)}
.nm{font-weight:400;color:var(--c)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar strong{font-size:18px;font-variant-numeric:tabular-nums}
.nav{font:inherit;font-size:18px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.shift{display:grid;grid-template-columns:1fr 1fr;gap:0}
.shift>div{padding:10px 12px;min-width:0}
.shift>div+div{border-left:1px solid var(--line)}
.shift .st{font-size:12px;font-weight:400;color:var(--muted);margin-bottom:4px}
.shift .ln{font-size:13px;font-variant-numeric:tabular-nums}
.shift .ln b{font-weight:400;color:var(--muted);margin-right:6px}
.offrow{padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.offrow .lab{color:var(--muted);margin-right:6px}
.close{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.close td{padding:6px 8px;border-bottom:1px solid var(--line)}
.close tr:last-child td{border-bottom:0}
.close td:first-child{font-weight:400;width:auto;padding-left:12px}
.close input{font:inherit;width:100%;max-width:76px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.close .prev{font-size:11px;color:var(--muted)}
.oc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.oc th,.oc td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.oc tr:last-child td{border-bottom:0}
.oc th{font-weight:400}
.oc .oc-lab{text-align:left}
.oc .oc-lab small{font-weight:400;color:var(--muted);font-size:11px}
.hd{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:6px;font-size:13px;font-variant-numeric:tabular-nums}
.hd:empty{display:none}
.hchip{display:inline-flex;align-items:center}
.hadd{display:flex;gap:6px}
.hadd input{font:inherit;font-size:13px;min-width:0;flex:0 1 160px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.hadd .btn{padding:5px 12px;font-size:13px}
.xline{display:flex;flex-wrap:wrap;gap:10px 22px;padding:12px}
.xitem{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.xitem.ro{cursor:default}
.chk:disabled{cursor:default;opacity:.55}
.chk:disabled:checked{opacity:1}
.dlayout{--sw:100px;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);gap:16px;align-items:start;position:relative}
.dlayout.docs{--sw:170px}
.dhandle{position:absolute;top:0;bottom:0;left:calc(var(--sw) + 2px);width:12px;cursor:col-resize;touch-action:none;z-index:2;display:flex;justify-content:center}
.dhandle::after{content:"";width:2px;height:100%;border-radius:2px;background:transparent;transition:background .15s}
.dhandle:hover::after,.dhandle.drag::after{background:var(--line)}
body.resizing{user-select:none;cursor:col-resize}
.dlist{position:sticky;top:calc(var(--hh,0px) + var(--th,0px) + 8px);max-height:calc(100vh - var(--hh,0px) - var(--th,0px) - 24px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px}
.di{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.di+.di{border-top:1px solid var(--line)}
.dy{position:sticky;top:-4px;z-index:1;background:var(--surface);font-size:12px;color:var(--muted);padding:8px 10px 4px;border-bottom:1px solid var(--line)}
@media (max-width:600px){.dy{padding:6px 2px 3px;text-align:center;font-size:11px}}
.di.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.di .dd{display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.di .dw{font-size:12px;color:var(--muted)}.di .dw.hol{color:var(--red)}
.di.today:not(.on) .dd{color:var(--accent)}
.di .dp{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.dlayout{--sw:62px;gap:10px}.dhandle{left:calc(var(--sw) - 1px)}.dlist{padding:2px;max-height:calc(100vh - 100px)}.di{padding:8px 4px;text-align:center}.di .dd{flex-direction:column;align-items:center;gap:0}.di .dp{display:none}}
.hchip .okb.on{background:var(--accent);color:var(--accent-ink)}
.hchip .okb{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;font:inherit;font-size:12px;padding:1px 8px;margin-left:6px;cursor:pointer}
.eqbtns{display:inline-flex;align-items:center;gap:4px}
.manrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 12px;font:inherit;color:var(--ink);cursor:pointer}
.manrow+.manrow{border-top:1px solid var(--line)}
.manrow:hover{background:var(--soft)}
.man-sum{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.man-go{color:var(--muted)}
.manb{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.manb.has{border-color:var(--accent);color:var(--accent)}
.man-text{line-height:1.7;display:flex;flex-direction:column;gap:8px}
.man-invid,.nvid{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#000;margin-top:6px}
.man-inimg{display:block;max-width:100%;max-height:420px;width:auto;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.man-box{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.man-editor{min-height:180px;max-height:50vh;overflow:auto;padding:12px;line-height:1.7;outline:none;white-space:pre-wrap;word-break:break-word}
.man-editor:empty::before{content:attr(data-ph);color:var(--muted)}
.man-editor .man-inimg{margin:6px 0;max-height:240px;cursor:default}
.man-tools{display:flex;justify-content:flex-end;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}
.man-num{position:absolute;left:4px;bottom:4px;font-size:11px;background:var(--surface);border-radius:999px;padding:0 6px}
.man-links{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.man-link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;color:var(--ink);text-decoration:none}
.man-link.solo{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.man-seg a:not(.man-link){color:var(--accent)}
.man-seg{display:flex;flex-direction:column;gap:6px}
.man-link+.man-link{border-top:1px solid var(--line)}
.man-link:hover{background:var(--soft)}
.man-tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.man-tag.v{color:var(--red)}.man-tag.p{color:var(--ok)}.man-tag.l{color:var(--muted)}
.man-lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.man-host{font-size:12px;color:var(--muted)}
.man-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.man-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.man-ph{position:relative}.man-ph .x{position:absolute;top:2px;right:2px;background:var(--surface);border-radius:999px}
.man-add{aspect-ratio:1;height:auto}
.man-edit{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.man-lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;width:100%}
@media (max-width:480px){.man-lrow{grid-template-columns:minmax(0,1fr) auto}.man-lrow input[type=url]{grid-column:1}.man-host{display:none}}
.add.nadd{flex-direction:column;align-items:stretch;gap:6px}
.add.nadd input{width:100%}
.add.nadd:not(.open) .nadd-bar{display:none}
.nadd-bar{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nadd-tools{display:inline-flex;gap:6px}
.docside .dd{justify-content:space-between}
.docside .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.dlayout.docs{--sw:96px}.docside .di{text-align:left;padding:9px 6px}.docside .dd{flex-direction:column;align-items:flex-start;gap:0}.docside .fn{white-space:normal;font-size:13px;line-height:1.3}}
.di.fedit{color:var(--muted);font-size:13px;text-align:center}
.fold-list{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fold-row{display:grid;grid-template-columns:minmax(0,1fr) 22px auto auto auto;gap:6px;align-items:center;width:100%}
.fold-row .by{text-align:center}
.fold-row{grid-template-columns:minmax(0,1fr) 22px auto auto auto}
.dhd{display:inline-grid;place-items:center;width:36px;height:36px;font-size:22px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fold-row.dragging{position:relative;z-index:2;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:8px}
.fold-row{transition:transform .15s}.fold-row.dragging{transition:none}
.fold-row.sub{padding-left:22px;position:relative}.fold-row.sub::before{content:"└";position:absolute;left:6px;color:var(--muted)}
.docside .di.sub{padding-left:22px}.docside .di.sub .fn{font-size:13px;color:var(--muted)}.docside .di.sub.on .fn{color:var(--ink)}
@media (max-width:600px){.docside .di.sub{padding-left:14px}}
.rnb{margin-left:8px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
table.close td .x{margin-left:4px;vertical-align:middle}
.man-lform{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;padding:8px;border-top:1px solid var(--line)}
.man-lform[hidden]{display:none}
@media (max-width:480px){.man-lform{grid-template-columns:minmax(0,1fr) auto}.man-lform input:first-child{grid-column:1/3}}
.fw-day.past{position:relative}
.fw-day.past::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom right,transparent calc(50% - .6px),var(--muted) calc(50% - .6px),var(--muted) calc(50% + .6px),transparent calc(50% + .6px));opacity:.55}
.xrank{margin-right:2px;color:var(--ink)}
.login{padding:16px}
.login .chips{flex-wrap:wrap}
#meBtn{padding:5px 10px}
#meBtn[hidden],#searchBtn[hidden]{display:none}
.fixrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-4px 0 18px}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;align-items:start}
@media (max-width:600px){.stores{grid-template-columns:minmax(0,1fr)}.st-top.st-pouring{order:1}.st-order.st-pouring{order:2}.st-stock.st-pouring{order:3}.st-top.st-meraki{order:4}.st-order.st-meraki{order:5}.st-stock.st-meraki{order:6}}
.chktog{font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:0 9px;cursor:pointer}
.chktog .chk-mini{width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor}
.chktog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chktog[aria-pressed="true"] .chk-mini{background:var(--accent-ink)}

.edt{cursor:text;white-space:pre-wrap;outline:none}
.list li{cursor:text}
.list li.editing{background:var(--soft)}

.edt:not([contenteditable]):empty::before{content:""}

.by,.by *{font-weight:300!important}

function inlineEdit(li,span,it,colName,opt={}){

    const t=span.innerText.replace(/ /g," ").replace(/\n{3,}/g,"\n\n").trim();
    const up={};
    if(t!==orig.trim()&&(t||it.image||it.video||it.fileId))up.text=t;else setLinked(span,orig);

    if(!skipBlur&&document.activeElement===span)span.blur()};
  li.addEventListener("click",e=>{
    if(li._noClick||e.target.closest("input,button,a,img,video,select,textarea")||span.isContentEditable)return;

function subAll(){
  const specs={notices:["createdAt",1000],checks:["createdAt",400],todos:["createdAt",600],schedule:["date",500],dayoffs:["date",800],closing:["date",240],cleaning:[null,100],cleanman:[null,200],pins:[null,20],docs:["updatedAt",500],extra:[null,60],monthnotes:[null,60],opencounts:[null,200],orders:["createdAt",400]};

  const go=name=>{
    const [f,n]=specs[name];let q=col(name);q=f?q.orderBy(f,"desc").limit(n):q.limit(n);

  };

}
