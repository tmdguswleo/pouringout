  const go=name=>{
    const [f,n]=specs[name];let q=col(name);q=f?q.orderBy(f,"desc").limit(n):q.limit(n);
    let first=true;
    q.onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));
      if(PENDING[name]&&PENDING[name].size){const have=new Set(S[name].map(x=>x.id));for(const [id,it] of PENDING[name]){if(have.has(id))PENDING[name].delete(id);else S[name].push(it)}}
      patchMerge(name);
      SRV[name]=new Map(snap.docs.map(d=>[d.id,d.data()||{}])); // 되돌리기용: 앱이 미리 바꿔 둔 화면 값이 아닌 서버 값
      for(const k of [...KNOWN.keys()])if(k.startsWith(name+"/"))KNOWN.delete(k); // 서버 값이 왔으니 그걸 믿음
      if(name==="dayoffs"&&window.__hopeCalDraw)try{window.__hopeCalDraw()}catch(e){}
      if(first){first=false;ready++;if(ready===total){loaded=true;clearTimeout(timer);setStatus("실시간 동기화 중");setTimeout(notifyAsk,700)}}
      saveCacheSoon();
      // 새 주소에서 저장해 둔 데이터 없이 처음 받을 때는, 근무·전달사항 등이 하나씩 튀어나오지 않게 다 받은 뒤 한 번에 그림
      if(WEB&&!loaded&&!cacheShown)return;
      render();
    },err=>{if(err.code==="unavailable"){setStatus("연결이 끊겼어요. 다시 연결 중…",true);setTimeout(()=>go(name),3000)}else setStatus("일부 내용을 불러오지 못했어요",true)});
  };
  Object.keys(specs).forEach(go);
}
